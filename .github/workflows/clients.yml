name: Build and Release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      stem: ${{ steps.version.outputs.stem }}
      image: ${{ steps.version.outputs.image }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Source Tag
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag || {
            echo 'Select the version tag when manually running a release.' >&2
            exit 1
          }
          TAG="v$(python3 scripts/version.py)"
          test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" || {
            echo 'Push the VERSION.json release tag from Gitea before running a release.' >&2
            exit 1
          }
      - name: Read Version and Check Published Release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py --prepare

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
      - name: Install Audio Tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Test Server, Web and Release Code
        run: |
          go test -race ./...
          go vet ./...
          for script in internal/web/static/*.js; do node --check "$script"; done
          node internal/web/lyrics_test.cjs
          node internal/web/playback_test.cjs
          python3 -m unittest discover -s scripts -p 'test_*.py'

  android:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Configure Optional Distribution Signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/resona.jks"
            chmod 600 "$RUNNER_TEMP/resona.jks"
            echo "RESONA_ANDROID_KEYSTORE=$RUNNER_TEMP/resona.jks" >> "$GITHUB_ENV"
          fi
      - name: Test, Build and Verify APK
        env:
          RESONA_ANDROID_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_STORE_PASSWORD || '' }}
          RESONA_ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          RESONA_ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: python3 scripts/build-clients.py android
      - name: Remove Signing Material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/resona.jks"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Resona-Android
          path: dist/Resona-Android-*
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Test, Build and Verify Windows Package
        run: python scripts/build-clients.py windows
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Resona-Windows
          path: dist/Resona-Windows-*
          if-no-files-found: error
          retention-days: 7

  apple:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test Shared Apple Code and Audio Routes
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          python3 scripts/test-apple.py
          python3 scripts/test-audio-routes.py
      - name: Build Unsigned iOS IPA and Universal macOS DMG
        run: |
          sh scripts/build-ios.sh
          python3 scripts/build-macos.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Resona-Apple
          path: artifacts/Resona-*
          if-no-files-found: error
          retention-days: 7

  server:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
      - run: python3 scripts/build-server.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Resona-Server
          path: dist/Resona-server-*
          if-no-files-found: error
          retention-days: 7

  docker:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Choose Archive Name
        id: archive
        env:
          STEM: ${{ needs.prepare.outputs.stem }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          echo "path=dist/Resona-Docker-$STEM-linux-$ARCH.tar" >> "$GITHUB_OUTPUT"
      - name: Build Versioned Docker Load Archive
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          outputs: type=docker,dest=${{ steps.archive.outputs.path }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            io.resona.build=${{ needs.prepare.outputs.build }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Compress and Checksum Docker Archive
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          gzip -n "$ARCHIVE"
          cd dist
          sha256sum "$(basename "$ARCHIVE").gz" > "$(basename "$ARCHIVE").gz.sha256"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Resona-Docker-${{ matrix.arch }}
          path: dist/Resona-Docker-*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, test, android, windows, apple, server, docker]
    if: github.event_name != 'pull_request' && needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      TAG: ${{ needs.prepare.outputs.tag }}
      STEM: ${{ needs.prepare.outputs.stem }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: Resona-*
          merge-multiple: true
          path: dist
      - name: Install DMG Verification Tool
        run: |
          if ! command -v 7zz >/dev/null && ! command -v 7z >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends 7zip
          fi
      - name: Verify All Packages Before Publication
        run: python3 scripts/release.py --verify-only
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push Docker Architectures and Multi-Architecture Manifest
        run: |
          for ARCH in amd64 arm64; do
            docker load --input "dist/Resona-Docker-$STEM-linux-$ARCH.tar.gz"
            docker push "$IMAGE:$TAG-$ARCH"
          done
          docker buildx imagetools create --tag "$IMAGE:$TAG" --tag "$IMAGE:latest" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')
          export DIGEST
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          digest = os.environ['DIGEST']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('Invalid Docker manifest digest')
          path = Path('dist') / f"Resona-Docker-{os.environ['STEM']}-images.txt"
          path.write_text(f"{os.environ['IMAGE']}:{os.environ['TAG']}\n{os.environ['IMAGE']}@{digest}\n")
          path.with_suffix('.txt.sha256').write_text(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n')
          PY
      - name: Upload, Read Back and Publish Immutable GitHub Release
        run: python3 scripts/release.py
