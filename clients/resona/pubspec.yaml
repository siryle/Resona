name: resona_client
description: Resona music client for Android phones, tablets and Windows.
publish_to: none
# Release version is supplied by scripts/build-clients.py from VERSION.json.
version: 0.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  media_kit: 1.2.6
  media_kit_libs_audio: 1.0.7
  flutter_secure_storage: 11.2.0
  path_provider: 2.1.6
  crypto: 3.0.8
  audio_service: 0.18.19
  audio_session: 0.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
